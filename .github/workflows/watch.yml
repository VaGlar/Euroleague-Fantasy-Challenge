name: Watchlist (personal edition)

# The ⭐ list of the personal dashboard, sent by functions/api/watch.js (the personal site, behind
# Cloudflare Access): saved in the private data repo as public/watch.json, where the update reads it
# for the Telegram alerts (elf/watch.py). Each run carries the whole list: the latest one wins.
on:
  workflow_dispatch:
    inputs:
      watch:
        description: "the watchlist as JSON (sent by the personal site)"
        required: true

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/elf-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private
      # the input goes through an environment variable, never into the script itself
      - name: Save the list
        env:
          WATCH: ${{ inputs.watch }}
        run: |
          python3 -m elf.watch save private/public/watch.json
          cd private
          git config user.name "elf-bot"
          git config user.email "elf-bot@users.noreply.github.com"
          git add public/watch.json
          git diff --cached --quiet && exit 0
          git commit -q -m "watchlist: update $(date -u +%F\ %H:%M)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs && git push -q && exit 0
            sleep $((i * 15))
          done
          exit 1
