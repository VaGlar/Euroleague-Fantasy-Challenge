name: Deploy Telegram bot (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-bot.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://elf-dashboard.pages.dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker
        id: deploy
        run: |
          npx --yes wrangler@3 deploy \
            --var DATA_URL:"$DASHBOARD_URL/data" --var DASHBOARD_URL:"$DASHBOARD_URL" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set worker secrets
        run: |
          # Webhook secret derived from the bot token: stable, never stored anywhere.
          hook=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-40)
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@3 secret put TELEGRAM_BOT_TOKEN
          printf '%s' "${TELEGRAM_CHAT_ID:-unset}" | npx --yes wrangler@3 secret put TELEGRAM_CHAT_ID
          printf '%s' "$hook" | npx --yes wrangler@3 secret put WEBHOOK_SECRET

      - name: Register Telegram webhook
        run: |
          hook=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-40)
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${{ steps.deploy.outputs.url }}/telegram" \
            --data-urlencode "secret_token=${hook}" | grep -q '"ok":true'
          echo "Webhook set to ${{ steps.deploy.outputs.url }}/telegram"
