name: Deploy Telegram bot (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-bot.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      GH_REPO: ${{ github.repository }}
      GH_REF: ${{ github.event.repository.default_branch }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://elf-dashboard.pages.dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN; do
            if [ -z "${!s}" ]; then
              echo "::error::Repository secret '$s' is empty or missing (Settings → Secrets and variables → Actions → Repository secrets; exact name, no spaces)"
              missing=1
            fi
          done
          [ -z "$TELEGRAM_CHAT_ID" ] && echo "::notice::TELEGRAM_CHAT_ID not set yet: send /start to the bot after this run, then add it and re-run."
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            me=$(curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
            echo "$me" | grep -q '"ok":true' || { echo "::error::Telegram rejected TELEGRAM_BOT_TOKEN: $me"; missing=1; }
          fi
          exit $missing

      - name: Deploy worker
        id: deploy
        run: |
          set -o pipefail
          npx --yes wrangler@3 deploy \
            --var DATA_URL:"$DASHBOARD_URL/data" --var DASHBOARD_URL:"$DASHBOARD_URL" \
            --var GH_REPO:"$GH_REPO" --var GH_REF:"$GH_REF" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev URL. Register a workers.dev subdomain once: Cloudflare dashboard → Workers & Pages → (onboarding) choose a subdomain, then re-run."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set worker secrets
        run: |
          # Webhook secret derived from the bot token: stable, never stored anywhere.
          hook=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-40)
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@3 secret put TELEGRAM_BOT_TOKEN
          printf '%s' "${TELEGRAM_CHAT_ID:-unset}" | npx --yes wrangler@3 secret put TELEGRAM_CHAT_ID
          printf '%s' "$hook" | npx --yes wrangler@3 secret put WEBHOOK_SECRET
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@3 secret put GH_DISPATCH_TOKEN
          else
            echo "::notice::GH_DISPATCH_TOKEN not set: /update will be disabled."
          fi
          # Cloudflare Access in front of the personal site: the bot reads its data with this service token
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            printf '%s' "$CF_ACCESS_CLIENT_ID" | npx --yes wrangler@3 secret put CF_ACCESS_CLIENT_ID
            printf '%s' "$CF_ACCESS_CLIENT_SECRET" | npx --yes wrangler@3 secret put CF_ACCESS_CLIENT_SECRET
          else
            echo "::notice::CF_ACCESS_CLIENT_ID/SECRET not set: fine while the personal site has no Cloudflare Access."
          fi

      - name: Register Telegram webhook
        run: |
          hook=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-40)
          res=$(curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${{ steps.deploy.outputs.url }}/telegram" \
            --data-urlencode "secret_token=${hook}")
          echo "$res"
          echo "$res" | grep -q '"ok":true'
          echo "Webhook set to ${{ steps.deploy.outputs.url }}/telegram — send /start to the bot."
