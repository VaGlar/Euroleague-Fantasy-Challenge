name: Probe team import (diagnostic)

# One-off check: can the data account read a team by its public id?
# Prints only structure and counts, never tokens.
on:
  workflow_dispatch:
    inputs:
      team_id:
        description: "fantasy team id (from the site's URL)"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Probe
        env:
          FANTASY_DATA_TOKEN: ${{ secrets.FANTASY_DATA_TOKEN }}
          TEAM_ID: ${{ inputs.team_id }}
        run: |
          python - <<'PY'
          import json, os, requests
          API = "https://fantaking-api.dunkest.com/api/v1"
          tid = int(os.environ["TEAM_ID"])
          h = {"Accept": "application/json", "Authorization": f"Bearer {os.environ['FANTASY_DATA_TOKEN']}"}
          cfg = requests.get(f"{API}/leagues/10/config", headers={"Accept": "application/json"}, timeout=30).json()
          cfg = cfg.get("data", cfg)
          md = cfg["current_matchday"]["id"]
          def shape(o, d=0):
              if isinstance(o, dict):
                  return {k: shape(v, d + 1) for k, v in list(o.items())[:25]} if d < 3 else "{…}"
              if isinstance(o, list):
                  return [shape(o[0], d + 1), f"×{len(o)}"] if o else []
              return type(o).__name__
          for path in (f"/fantasy-teams/{tid}/matchdays/{md - 1}/roster", f"/fantasy-teams/{tid}/matchdays/{md}/roster"):
              r = requests.get(API + path, headers=h, timeout=30)
              print("==", path, r.status_code)
              try:
                  body = r.json(); data = body.get("data", body) if isinstance(body, dict) else body
                  print(json.dumps(shape(data), indent=1)[:3000])
                  if isinstance(data, dict) and isinstance(data.get("players"), list):
                      ps = data["players"]
                      print("players:", len(ps), "| positions:", sorted({(p.get("position") or {}).get("name") for p in ps}),
                            "| captain set:", any(p.get("is_captain") for p in ps),
                            "| court positions:", sorted(p.get("court_position") for p in ps if p.get("court_position") is not None))
              except Exception as e:
                  print("not json:", r.text[:200], e)
          PY
