name: Update data & dashboard

on:
  # Timing lives in the Telegram bot's Cloudflare cron (GitHub's schedule runs hours
  # late): 07:00 Athens every day + ~2.5h after the last game of each game day.
  workflow_dispatch:
    inputs:
      backtest:
        description: "Re-run the backtest and refit model weights"
        type: boolean
        default: false
      notify:
        description: "Message Telegram when finished (used by /update)"
        type: boolean
        default: false
      report:
        description: "Send today's report to Telegram when done (the bot's 10:05 run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

# Live vs preview: a run on the default branch (main) is the real thing - it commits the data and
# deploys the two sites. A run on any other branch (the work branch) is a preview: it deploys to
# dev.<site>.pages.dev, commits nothing and sends nothing to Telegram.
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      LIVE: ${{ github.ref_name == github.event.repository.default_branch }}
      PAGES_BRANCH: ${{ github.ref_name == github.event.repository.default_branch && 'main' || 'dev' }}
      # The private data repo (<owner>/elf-data) holds what the public repo must not: the article
      # archive (publishers' text) and the owner's team, report and lineups. Without the secret
      # everything stays in this repo, as before.
      HAS_DATA_REPO: ${{ secrets.DATA_REPO_TOKEN != '' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Private data repo
        if: ${{ env.HAS_DATA_REPO == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/elf-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private

      - name: Restore the private data (full files over the public repo's sanitized ones)
        if: ${{ env.HAS_DATA_REPO == 'true' }}
        run: |
          mkdir -p data/public data/archive
          [ -d private/public ] && cp -r private/public/. data/public/ || true
          [ -d private/archive ] && cp -r private/archive/. data/archive/ || true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backtest (first run or on request)
        if: ${{ inputs.backtest || hashFiles('data/public/model_params.json') == '' }}
        run: |
          python -m elf.history 2024 2025
          python -m elf.backtest 2025 --save

      - name: Pipeline
        env:
          FANTASY_TOKEN: ${{ secrets.FANTASY_TOKEN }}
          FANTASY_DATA_TOKEN: ${{ secrets.FANTASY_DATA_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://elf-dashboard.pages.dev' }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}          # the feed proxy sits behind Cloudflare Access
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python -m elf.run

      # The real data of the day, before anything is committed, sent or deployed: an API that
      # changed shape, a NaN or half-written file, an empty report stop the run here (the sites
      # keep the last good data; the owner gets the reasons on Telegram). elf/validate.py
      - name: Data check
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ env.LIVE == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m elf.validate

      - name: Problems to the owner (Telegram)
        if: ${{ always() && env.LIVE == 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m elf.notify health

      - name: Send today's report
        if: ${{ inputs.report && env.LIVE == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m elf.notify report

      - name: Save the private data (full files, article archive)
        if: ${{ env.LIVE == 'true' && env.HAS_DATA_REPO == 'true' }}
        run: |
          rm -rf private/public private/archive
          cp -r data/public private/public
          mkdir -p data/archive && cp -r data/archive private/archive
          cd private
          git config user.name "elf-bot"
          git config user.email "elf-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "data: update $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1

      # From here on data/public is the public repo's copy: sanitized (elf/publish.py), and the
      # archive and private-only files are no longer tracked here.
      - name: Sanitize for the public repo
        if: ${{ env.LIVE == 'true' && env.HAS_DATA_REPO == 'true' }}
        run: |
          python -m elf.publish --repo
          git rm -r -q --cached --ignore-unmatch data/archive data/public/report.json \
            data/public/lineup_log.json data/public/roster_shape.json data/public/health_last.json

      - name: Commit data
        if: ${{ env.LIVE == 'true' }}
        run: |
          git config user.name "elf-bot"
          git config user.email "elf-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: update $(date -u +%F\ %H:%M)"
          # the branch may have moved while the pipeline ran (code pushes): replay the
          # data commit on top; on a data conflict keep this run's (newer) files
          branch="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$branch" && git push origin "HEAD:$branch" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Build site
        run: |
          mkdir -p site/data
          cp -r web/* site/
          # the personal site gets the full files (behind Cloudflare Access)
          src=data/public; [ -d private/public ] && src=private/public
          cp "$src"/*.json site/data/

      - name: Deploy to Cloudflare Pages (preview on a work branch → https://dev.elf-dashboard.pages.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create elf-dashboard --production-branch main || true
          npx --yes wrangler@4 pages deploy site --project-name elf-dashboard --branch "$PAGES_BRANCH" --commit-dirty=true

      # Public edition: same run, sanitized data (elf/publish.py). Off until the repo
      # variable PUBLIC_PROJECT (Cloudflare Pages project name) is set.
      - name: Deploy public edition
        if: ${{ vars.PUBLIC_PROJECT != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PUBLIC_PROJECT }}
        run: |
          PROJECT=$(echo "$PROJECT" | tr '[:upper:]' '[:lower:]')   # Pages names are lower-case
          python -m elf.publish site_public
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main || true
          npx --yes wrangler@4 pages deploy site_public --project-name "$PROJECT" --branch "$PAGES_BRANCH" --commit-dirty=true

      - name: Run failed (Telegram)
        # the data check sends its own, more precise message
        if: ${{ failure() && !inputs.notify && env.LIVE == 'true' && steps.check.outcome != 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Το αυτόματο update απέτυχε — η δημόσια έκδοση δεν ενημερώθηκε: ${RUN_URL}" > /dev/null

      - name: Notify Telegram
        if: ${{ always() && inputs.notify && env.LIVE == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          CHECK: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ "$CHECK" = "failure" ] && exit 0      # the data check already said why
          if [ "$STATUS" = "success" ]; then
            f=data/public/predictions.json; [ -f private/public/predictions.json ] && f=private/public/predictions.json
            health=$(F="$f" python -c "import json,os;h=json.load(open(os.environ['F'])).get('health') or [];print('\n'.join('⚠️ '+x for x in h) or 'Χωρίς προβλήματα')")
            text=$(printf '✅ Το update ολοκληρώθηκε.\n%s\n\n/report για το report.' "$health")
          else
            text="❌ Το update απέτυχε: $RUN_URL"
          fi
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" > /dev/null
