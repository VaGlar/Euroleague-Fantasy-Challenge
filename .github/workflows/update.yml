name: Update data & dashboard

on:
  schedule:
    # UTC. Morning runs land before the 11:00 Athens notification even when
    # GitHub's scheduler is late; the night run picks up finished games.
    - cron: "15 4 * * *"
    - cron: "30 7 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Re-run the backtest and refit model weights"
        type: boolean
        default: false
      notify:
        description: "Message Telegram when finished (used by /update)"
        type: boolean
        default: false
      report:
        description: "Send today's report to Telegram when done (the bot's 10:05 run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backtest (first run or on request)
        if: ${{ inputs.backtest || hashFiles('data/public/model_params.json') == '' }}
        run: |
          python -m elf.history 2024 2025
          python -m elf.backtest 2025 --save

      - name: Pipeline
        env:
          FANTASY_TOKEN: ${{ secrets.FANTASY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://elf-dashboard.pages.dev' }}
        run: python -m elf.run

      - name: Send today's report
        if: ${{ inputs.report }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m elf.notify report

      - name: Commit data
        run: |
          git config user.name "elf-bot"
          git config user.email "elf-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: update $(date -u +%F\ %H:%M)"
          # the branch may have moved while the pipeline ran (code pushes): replay the
          # data commit on top; on a data conflict keep this run's (newer) files
          branch="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$branch" && git push origin "HEAD:$branch" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Build site
        run: |
          mkdir -p site/data
          cp -r web/* site/
          cp data/public/*.json site/data/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create elf-dashboard --production-branch main || true
          npx --yes wrangler@3 pages deploy site --project-name elf-dashboard --branch main --commit-dirty=true

      - name: Notify Telegram
        if: ${{ always() && inputs.notify }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            health=$(python -c "import json;h=json.load(open('data/public/predictions.json')).get('health') or [];print('\n'.join('⚠️ '+x for x in h) or 'Χωρίς προβλήματα')")
            text=$(printf '✅ Το update ολοκληρώθηκε.\n%s\n\n/report για το report.' "$health")
          else
            text="❌ Το update απέτυχε: $RUN_URL"
          fi
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" > /dev/null
