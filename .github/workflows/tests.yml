name: Tests

on:
  # A PR is tested as it would be merged (its branch + the current main), so what reaches main
  # (= live) has already been tested; PRs are merged one at a time, so there is no second run after
  # the merge. Two PRs open at once: GitHub's «Require branches to be up to date before merging»
  # makes the second one re-test on the new main. A branch without a PR isn't tested on push
  # (open the PR early, as a draft, to get CI on it); workflow_dispatch runs any branch by hand.
  pull_request:
  workflow_dispatch:

# Several pushes to a PR in a row: only the newest is tested, the older runs are cancelled (they
# cost Actions minutes and their result no longer matters).
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Python tests (no network) + coverage floor (.coveragerc)
        run: python -m pytest -q --cov
      - name: JavaScript syntax (bot, feed proxy, dashboard)
        run: |
          node --check worker/src/index.js
          node --check web/opt.js
          node --check web/team.js
          node --input-type=module --check < functions/feed.js
          node --input-type=module --check < "functions/api/sync/[[path]].js"
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path("web/index.html").read_text()
          js = "\n".join(re.findall(r"<script>(.*?)</script>", html, re.S))
          pathlib.Path("/tmp/dashboard.js").write_text(js)
          PY
          node --check /tmp/dashboard.js

  changes:
    # Does this change reach the dashboard? The UI tests use frozen fixtures, so only web/,
    # tests/ui/ and what builds the public edition (elf/publish.py) can break them.
    # Decided for PRs; manual runs always run it.
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=""
          if [ "$EVENT" = pull_request ]; then from="$PR_BASE"; fi
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            echo "ui=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$from" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(web/|tests/ui/|elf/(publish|config)\.py$|requirements\.txt$|\.github/workflows/tests\.yml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  ui:
    # the dashboard in a browser: both editions, PC and iPhone-sized screens (tests/ui)
    # skipped (counts as passed) when the change cannot reach the dashboard, see `changes`
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/ui/package-lock.json') }}
      - name: Install Playwright
        working-directory: tests/ui
        env:
          CACHED: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          npm ci
          if [ "$CACHED" = true ]; then
            npx playwright install-deps chromium      # system libraries only; browser from cache
          else
            npx playwright install --with-deps chromium
          fi
      - name: UI tests
        working-directory: tests/ui
        run: npx playwright test
      - name: Report (screenshots of every tab, traces of failures)
        if: ${{ always() }}
        # a full artifact quota must not turn green tests red
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ui-report
          path: tests/ui/playwright-report
          retention-days: 2
