name = "elf-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
# Hourly at xx:05 UTC; the handler decides in Athens time (07:05 update, 10:05 report,
# update 3h and lineup check 2h before the first tip-off, update after the last game).
crons = ["5 * * * *"]

[vars]
# Overridden at deploy time by the GitHub workflow.
DATA_URL = "https://elf-dashboard.pages.dev/data"
DASHBOARD_URL = "https://elf-dashboard.pages.dev"
