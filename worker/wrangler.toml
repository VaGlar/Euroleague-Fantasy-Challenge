name = "elf-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
# Hourly at xx:05 UTC; the handler decides in Athens time (10:05 update + report,
# 11:05 fallback, pre-deadline check 2h before the first tip-off).
crons = ["5 * * * *"]

[vars]
# Overridden at deploy time by the GitHub workflow.
DATA_URL = "https://elf-dashboard.pages.dev/data"
DASHBOARD_URL = "https://elf-dashboard.pages.dev"
